[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "weather-pipeline"
version = "1.0.0"
description = "Production-grade ETL pipeline for weather forecast data from Open-Meteo API"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.33.0",
    "pandas>=3.0.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
schedule = [
    "schedule>=1.2.0",
]
dashboard = [
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
]
all = [
    "weather-pipeline[dev,schedule,dashboard]",
]

[project.scripts]
weather-pipeline = "main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
