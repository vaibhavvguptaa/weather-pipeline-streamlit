name: Scheduled ETL Pipeline

on:
  schedule:
    # Run twice a day (at 00:00 and 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch:
    # Allows manual triggering of the workflow from the GitHub UI

permissions:
  contents: write

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run ETL Pipeline
        env:
          CITIES: "Delhi,Mumbai,Bangalore,Kolkata,Chennai"
          OUTPUT_DIR: "data"
          DB_NAME: "weather.db"
        run: |
          python main.py

      - name: Commit and push updated database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather.db
          # Only commit and push if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update weather database: $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
            git push
          else
            echo "No changes detected in the database. Skipping commit."
          fi
